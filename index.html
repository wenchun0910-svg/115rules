<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>班級常規分數查詢系統 - 和風版</title>
    
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- 引入 Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* 色彩與字體配置 */
        :root {
            --color-washi: #F4F1EA; /* 和紙白 */
            --color-sumi: #3E3A39;  /* 墨黑 */
            --color-matcha: #6B705C; /* 抹茶綠 */
            --color-matcha-light: #A5A58D;
            --color-sakura: #CB997E; /* 櫻花/陶土色 */
            --color-kurenai: #9E2A2B; /* 傳統暗紅 */
            --color-border: #D5CFC4; /* 邊框色 */
        }

        body {
            background-color: var(--color-washi);
            color: var(--color-sumi);
            font-family: 'Noto Sans TC', sans-serif;
            background-image: url('data:image/svg+xml;utf8,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><g fill="%23e5e0d8" fill-opacity="0.4" fill-rule="evenodd"><circle cx="50" cy="50" r="2"/></g></svg>');
        }

        .font-serif-tc { font-family: 'Noto Serif TC', serif; }

        /* 標題裝飾線 */
        .title-decoration { position: relative; display: inline-block; }
        .title-decoration::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 3px;
            background-color: var(--color-sakura);
            border-radius: 2px;
        }

        /* 自定義捲軸 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--color-washi); }
        ::-webkit-scrollbar-thumb { background: var(--color-matcha-light); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--color-matcha); }

        .hidden { display: none !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col relative overflow-x-hidden">

    <!-- 頂部導航列 -->
    <header class="bg-[#6B705C] text-[#F4F1EA] shadow-md py-4 sm:py-5 px-4 sm:px-6 sticky top-0 z-30 border-b-4 border-[#CB997E]">
        <div class="max-w-5xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <h1 class="text-xl sm:text-2xl font-bold font-serif-tc tracking-widest flex items-center gap-3">
                <i class="fas fa-leaf text-[#CB997E]"></i>
                <span class="title-decoration">常規分數查詢</span>
            </h1>
            
            <div class="flex items-center gap-2 sm:gap-3 w-full sm:w-auto">
                <!-- 週次選擇器 -->
                <div class="relative flex-grow sm:w-48">
                    <select id="weekSelector" class="w-full appearance-none bg-[#F4F1EA] text-[#3E3A39] border-2 border-[#A5A58D] py-2 px-3 sm:px-4 pr-8 rounded-sm font-medium focus:outline-none focus:border-[#CB997E] focus:ring-1 focus:ring-[#CB997E] transition cursor-pointer shadow-sm text-sm sm:text-base">
                        <option value="">讀取中...</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-[#6B705C]">
                        <i class="fas fa-angle-down"></i>
                    </div>
                </div>
                <!-- 管理按鈕 -->
                <button id="btnOpenAdmin" class="bg-[#A5A58D] hover:bg-[#CB997E] text-white px-3 sm:px-4 py-2 rounded-sm transition shadow-sm whitespace-nowrap flex items-center gap-1 sm:gap-2 text-sm sm:text-base">
                    <i class="fas fa-cog"></i> <span class="hidden sm:inline">管理</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="flex-grow max-w-5xl mx-auto w-full p-3 sm:p-6 flex flex-col gap-4 sm:gap-6">
        
        <!-- 載入動畫 -->
        <div id="loader" class="flex-grow flex flex-col items-center justify-center py-20 text-[#6B705C]">
            <i class="fas fa-circle-notch fa-spin text-4xl mb-4"></i>
            <p class="font-serif-tc tracking-widest text-sm sm:text-base">資料同步中...</p>
        </div>

        <!-- 極簡資料表格 -->
        <div id="tableContainer" class="bg-white rounded-sm shadow-sm border border-[#D5CFC4] overflow-hidden hidden relative mt-2">
            <div class="overflow-x-auto w-full pb-2">
                <table class="min-w-full text-left border-collapse">
                    <thead id="tableHead" class="bg-[#F9F8F6] text-[#6B705C] border-b-2 border-[#D5CFC4] font-serif-tc tracking-wide">
                        <tr>
                            <th class="py-3 sm:py-4 px-3 sm:px-4 text-center w-16 sm:w-20 whitespace-nowrap text-sm sm:text-base">座號</th>
                            <th class="py-3 sm:py-4 px-3 sm:px-4 w-24 sm:w-32 whitespace-nowrap text-sm sm:text-base">姓名</th>
                            <th class="py-3 sm:py-4 px-3 sm:px-4 text-center w-20 sm:w-24 whitespace-nowrap text-sm sm:text-base">總分</th>
                            <th class="py-3 sm:py-4 px-3 sm:px-4 min-w-[200px] text-sm sm:text-base">備註</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="text-xs sm:text-sm divide-y divide-[#EAE6DF]">
                        <!-- 內容由 JS 動態生成 -->
                    </tbody>
                </table>
            </div>
        </div>
        
        <!-- 無結果提示 -->
        <div id="noResults" class="hidden text-center py-12 sm:py-16 bg-white rounded-sm border border-[#D5CFC4] text-[#A5A58D]">
            <i class="fas fa-wind text-3xl sm:text-4xl mb-3 opacity-50"></i>
            <p class="font-serif-tc tracking-widest text-base sm:text-lg">查無相關紀錄</p>
        </div>

        <!-- 獨立的行為扣分與備註紀錄區塊 -->
        <div id="behaviorContainer" class="hidden flex flex-col gap-4 mt-2">
            <!-- 由 JS 動態生成 -->
        </div>

    </main>

    <footer class="text-center py-4 sm:py-6 text-[#A5A58D] text-[10px] sm:text-xs font-serif-tc tracking-widest mt-auto border-t border-[#D5CFC4]">
        &copy; <span id="currentYear"></span> 和風常規查詢系統 | Powered by Firebase
    </footer>

    <!-- ==================== 管理員專區 Modal ==================== -->
    <div id="adminModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex justify-center items-center backdrop-blur-sm p-4">
        <div class="bg-[#F4F1EA] rounded-sm shadow-xl w-full max-w-md max-h-[90vh] overflow-y-auto flex flex-col border-t-4 border-[#CB997E]">
            
            <div class="px-4 sm:px-6 py-3 sm:py-4 border-b border-[#D5CFC4] flex justify-between items-center bg-white sticky top-0 z-10">
                <h3 class="font-serif-tc font-bold text-[#6B705C] text-base sm:text-lg"><i class="fas fa-shield-alt mr-2"></i>管理員專區</h3>
                <button id="btnCloseAdmin" class="text-gray-400 hover:text-gray-700 transition">
                    <i class="fas fa-times text-lg sm:text-xl"></i>
                </button>
            </div>
            
            <div class="p-4 sm:p-6 flex-grow relative">
                <!-- 訊息提示區 -->
                <div id="adminMessage" class="hidden mb-4 p-3 rounded-sm text-xs sm:text-sm font-bold text-center"></div>

                <!-- 1. 登入視圖 -->
                <div id="adminLoginView" class="flex flex-col gap-3 sm:gap-4">
                    <p class="text-xs sm:text-sm text-[#3E3A39]">請輸入管理員密碼以進入後台功能：</p>
                    <input type="password" id="adminPwd" placeholder="請輸入密碼..." class="w-full bg-white border border-[#D5CFC4] py-2 px-3 rounded-sm focus:outline-none focus:border-[#CB997E] text-sm">
                    <button id="btnLogin" class="w-full bg-[#6B705C] hover:bg-[#585C4C] text-white py-2 rounded-sm font-bold transition mt-1 sm:mt-2 text-sm sm:text-base">
                        登入
                    </button>
                    <p class="text-[10px] sm:text-xs text-center text-gray-400 mt-2">提示：預設密碼為 admin</p>
                </div>

                <!-- 2. 控制面板視圖 (登入後顯示) -->
                <div id="adminDashboardView" class="hidden flex flex-col gap-4 sm:gap-6">
                    
                    <!-- 匯入功能 -->
                    <div class="bg-white p-3 sm:p-4 rounded-sm border border-[#D5CFC4] shadow-sm">
                        <h4 class="font-bold text-[#3E3A39] mb-2 sm:mb-3 flex items-center gap-2 text-sm sm:text-base">
                            <i class="fas fa-file-csv text-[#6B705C]"></i> 匯入班級常規 (.csv)
                        </h4>
                        <!-- 新增：自訂週次輸入框 -->
                        <input type="text" id="importWeekName" placeholder="請輸入週次 (例如：第1週)" class="block w-full text-xs sm:text-sm py-2 px-3 border border-[#D5CFC4] rounded-sm mb-3 focus:outline-none focus:border-[#CB997E] text-[#3E3A39]">
                        
                        <input type="file" id="csvFileInput" accept=".csv" class="block w-full text-xs sm:text-sm text-gray-500 file:mr-2 sm:file:mr-4 file:py-1.5 sm:file:py-2 file:px-3 sm:file:px-4 file:rounded-sm file:border-0 file:text-xs sm:file:text-sm file:font-semibold file:bg-[#F9F8F6] file:text-[#6B705C] hover:file:bg-[#EAE6DF] cursor-pointer border border-[#D5CFC4] rounded-sm mb-3">
                        <button id="btnImport" class="w-full bg-[#CB997E] hover:bg-[#b0846c] text-white py-2 rounded-sm font-bold transition flex items-center justify-center gap-2 text-sm sm:text-base">
                            <i class="fas fa-upload"></i> 上傳並解析寫入
                        </button>
                    </div>

                    <!-- 刪除功能 -->
                    <div class="bg-white p-3 sm:p-4 rounded-sm border border-[#D5CFC4] shadow-sm">
                        <h4 class="font-bold text-[#9E2A2B] mb-2 sm:mb-3 flex items-center gap-2 text-sm sm:text-base">
                            <i class="fas fa-trash-alt"></i> 刪除整班紀錄
                        </h4>
                        <div class="flex flex-col sm:flex-row gap-2">
                            <select id="deleteWeekSelector" class="flex-grow bg-[#F9F8F6] border border-[#D5CFC4] py-2 px-3 rounded-sm focus:outline-none text-xs sm:text-sm">
                                <option value="">請選擇要刪除的週次</option>
                            </select>
                            <button id="btnDelete" class="bg-[#9E2A2B] hover:bg-[#7a2021] text-white px-4 py-2 rounded-sm font-bold transition text-xs sm:text-sm whitespace-nowrap w-full sm:w-auto">
                                執行刪除
                            </button>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        document.getElementById('currentYear').textContent = new Date().getFullYear();

        // Firebase 設置
     const firebaseConfig = {
  apiKey: "AIzaSyAmFsYszaIDv2YnJNOi0oOf0rzqEE2yx5s",
  authDomain: "rules-2b444.firebaseapp.com",
  projectId: "rules-2b444",
  storageBucket: "rules-2b444.firebasestorage.app",
  messagingSenderId: "399429207355",
  appId: "1:399429207355:web:7cbbc07d8186780553631e"
};
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-class-app';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 系統狀態
        let appState = {
            rawData: [],
            weeks: [],
            currentWeek: "",
            isAdminLoggedIn: false
        };

        const dom = {
            weekSelector: document.getElementById('weekSelector'),
            loader: document.getElementById('loader'),
            tableContainer: document.getElementById('tableContainer'),
            tableBody: document.getElementById('tableBody'),
            behaviorContainer: document.getElementById('behaviorContainer'),
            noResults: document.getElementById('noResults'),
            
            btnOpenAdmin: document.getElementById('btnOpenAdmin'),
            btnCloseAdmin: document.getElementById('btnCloseAdmin'),
            adminModal: document.getElementById('adminModal'),
            adminLoginView: document.getElementById('adminLoginView'),
            adminDashboardView: document.getElementById('adminDashboardView'),
            adminPwd: document.getElementById('adminPwd'),
            btnLogin: document.getElementById('btnLogin'),
            adminMessage: document.getElementById('adminMessage'),
            
            importWeekName: document.getElementById('importWeekName'),
            csvFileInput: document.getElementById('csvFileInput'),
            btnImport: document.getElementById('btnImport'),
            deleteWeekSelector: document.getElementById('deleteWeekSelector'),
            btnDelete: document.getElementById('btnDelete')
        };

        // ==========================================
        // 1. Firebase 驗證與資料讀取
        // ==========================================
        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Auth Error:", error);
            }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                fetchFirestoreData();
            }
        });
        initAuth();

        function fetchFirestoreData() {
            const user = auth.currentUser;
            if (!user) return;

            const scoresRef = collection(db, 'artifacts', appId, 'public', 'data', 'scores');

            onSnapshot(scoresRef, (snapshot) => {
                if (snapshot.empty) {
                    appState.rawData = [];
                    processWeeks();
                } else {
                    const data = [];
                    snapshot.forEach(doc => { data.push(doc.data()); });
                    appState.rawData = data;
                    processWeeks();
                }
            }, (error) => {
                console.error("Firestore Error: ", error);
            });
        }

        // ==========================================
        // 2. 畫面更新邏輯
        // ==========================================
        function processWeeks() {
            const weeksSet = new Set(appState.rawData.map(item => item.week));
            appState.weeks = Array.from(weeksSet).sort().reverse(); 
            
            dom.weekSelector.innerHTML = '';
            dom.deleteWeekSelector.innerHTML = '<option value="">請選擇要刪除的週次</option>';

            if (appState.weeks.length === 0) {
                dom.weekSelector.innerHTML = '<option value="">尚無資料</option>';
                appState.currentWeek = "";
            } else {
                appState.weeks.forEach(week => {
                    const opt1 = document.createElement('option');
                    opt1.value = week;
                    opt1.textContent = week;
                    dom.weekSelector.appendChild(opt1);

                    const opt2 = document.createElement('option');
                    opt2.value = week;
                    opt2.textContent = week;
                    dom.deleteWeekSelector.appendChild(opt2);
                });

                if (!appState.currentWeek || !appState.weeks.includes(appState.currentWeek)) {
                    appState.currentWeek = appState.weeks[0];
                }
                dom.weekSelector.value = appState.currentWeek;
            }

            dom.loader.classList.add('hidden');
            renderCurrentWeek();
        }

        function renderCurrentWeek() {
            if (!appState.currentWeek) {
                drawTable([]);
                return;
            }
            let displayData = appState.rawData.filter(item => item.week === appState.currentWeek);
            displayData.sort((a, b) => parseInt(a.seatNo) - parseInt(b.seatNo));
            drawTable(displayData);
        }

        function drawTable(dataArray) {
            dom.tableBody.innerHTML = '';
            if (dataArray.length === 0) {
                dom.tableContainer.classList.add('hidden');
                dom.behaviorContainer.classList.add('hidden');
                dom.noResults.classList.remove('hidden');
                return;
            } else {
                dom.tableContainer.classList.remove('hidden');
                dom.noResults.classList.add('hidden');
            }

            // 1. 繪製主表格
            dataArray.forEach(row => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-[#F9F8F6] transition duration-200';
                
                const isWarning = parseInt(row.score) < 70;
                
                const tdSeat = document.createElement('td');
                tdSeat.className = 'py-3 sm:py-4 px-3 sm:px-4 text-center font-medium text-[#A5A58D] whitespace-nowrap';
                tdSeat.textContent = row.seatNo;
                
                const tdName = document.createElement('td');
                tdName.className = 'py-3 sm:py-4 px-3 sm:px-4 font-bold text-[#3E3A39] text-sm sm:text-base font-serif-tc tracking-widest whitespace-nowrap';
                tdName.textContent = row.name;

                const tdScore = document.createElement('td');
                tdScore.className = `py-3 sm:py-4 px-3 sm:px-4 text-center font-bold text-lg sm:text-xl whitespace-nowrap ${isWarning ? 'text-[#9E2A2B]' : 'text-[#6B705C]'}`;
                tdScore.innerHTML = isWarning ? `${row.score} <i class="fas fa-exclamation-circle text-xs align-top ml-0.5"></i>` : row.score;

                const tdRemark = document.createElement('td');
                tdRemark.className = 'py-3 px-3 sm:px-4 min-w-[200px] text-xs sm:text-sm text-[#3E3A39] leading-relaxed';
                tdRemark.innerHTML = (row.remark && row.remark.trim() !== '') ? row.remark.replace(/\n/g, '<br>') : '';

                if (isWarning) tr.classList.add('bg-[#FFF8F8]');

                tr.appendChild(tdSeat);
                tr.appendChild(tdName);
                tr.appendChild(tdScore);
                tr.appendChild(tdRemark);
                dom.tableBody.appendChild(tr);
            });

            // 2. 呼叫繪製底部的行為紀錄
            renderBehaviors(dataArray);
        }

        function renderBehaviors(dataArray) {
            const container = dom.behaviorContainer;
            container.innerHTML = '';
            
            // 只要有顯示表格資料，這個區塊就一定要打開，才不會被誤以為不見了
            container.classList.remove('hidden');

            // 區塊標題
            const title = document.createElement('h3');
            title.className = 'text-base sm:text-lg font-bold text-[#3E3A39] border-b-2 border-[#D5CFC4] pb-2 mt-4 font-serif-tc flex items-center gap-2';
            title.innerHTML = '<i class="fas fa-exclamation-triangle text-[#9E2A2B]"></i> 扣分狀況說明';
            container.appendChild(title);

            // 僅過濾出有「扣分紀錄」的學生顯示在最下方
            const studentsWithDeductions = dataArray.filter(row => 
                (row.deductions && row.deductions.length > 0)
            );

            // 如果本週大家都很乖、沒有扣分，就明確顯示「無扣分紀錄」的訊息
            if (studentsWithDeductions.length === 0) {
                const emptyMsg = document.createElement('div');
                emptyMsg.className = 'bg-[#FDF8F5] p-4 rounded-sm border border-[#F5E6DF] text-[#6B705C] text-center text-sm sm:text-base mt-3 font-medium shadow-sm';
                emptyMsg.innerHTML = '<i class="fas fa-check-circle text-[#A5A58D] mr-1"></i> 本週全班表現優良，無扣分紀錄！';
                container.appendChild(emptyMsg);
                return;
            }

            // 簡單列表容器
            const list = document.createElement('ul');
            list.className = 'flex flex-col gap-2 mt-3';
            
            studentsWithDeductions.forEach(row => {
                const li = document.createElement('li');
                li.className = 'bg-white p-3 sm:p-4 rounded-sm shadow-sm border border-[#D5CFC4] flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-4';
                
                let contentHtml = `
                    <div class="flex items-center gap-2 sm:w-32 flex-shrink-0">
                        <span class="bg-[#3E3A39] text-[#F4F1EA] rounded-full h-6 w-6 flex items-center justify-center font-bold text-xs shadow-sm">${row.seatNo}</span>
                        <span class="font-bold text-[#3E3A39] text-sm sm:text-base font-serif-tc tracking-widest">${row.name}</span>
                    </div>
                    <div class="text-xs sm:text-sm text-[#9E2A2B] leading-relaxed flex-grow font-medium">
                `;

                // 扣分細節轉換為簡單文字 (例如: 星期三 h，星期四 c)
                const dText = row.deductions.map(d => `${d.day} ${d.reason}`).join('，');
                contentHtml += dText;

                contentHtml += `</div>`;
                
                li.innerHTML = contentHtml;
                list.appendChild(li);
            });

            container.appendChild(list);
        }

        dom.weekSelector.addEventListener('change', (e) => {
            appState.currentWeek = e.target.value;
            renderCurrentWeek();
        });

        // ==========================================
        // 3. 管理員功能與 CSV 解析
        // ==========================================
        
        dom.btnOpenAdmin.addEventListener('click', () => {
            dom.adminModal.classList.remove('hidden');
            hideAdminMessage();
            if (appState.isAdminLoggedIn) {
                showAdminDashboard();
            } else {
                dom.adminLoginView.classList.remove('hidden');
                dom.adminDashboardView.classList.add('hidden');
                dom.adminPwd.value = '';
            }
        });

        dom.btnCloseAdmin.addEventListener('click', () => dom.adminModal.classList.add('hidden'));

        dom.btnLogin.addEventListener('click', () => {
            const pwd = dom.adminPwd.value;
            if (pwd === 'admin') { 
                appState.isAdminLoggedIn = true;
                showAdminDashboard();
                showAdminMessage("登入成功！", "success");
            } else {
                showAdminMessage("密碼錯誤，請重新輸入。", "error");
            }
        });

        function showAdminDashboard() {
            dom.adminLoginView.classList.add('hidden');
            dom.adminDashboardView.classList.remove('hidden');
        }

        function showAdminMessage(text, type) {
            dom.adminMessage.textContent = text;
            dom.adminMessage.className = `mb-4 p-2 sm:p-3 rounded-sm text-xs sm:text-sm font-bold text-center block ${
                type === 'success' ? 'bg-[#FDF8F5] text-[#CB997E] border border-[#CB997E]' : 'bg-[#FFF8F8] text-[#9E2A2B] border border-[#9E2A2B]'
            }`;
        }
        function hideAdminMessage() { dom.adminMessage.classList.add('hidden'); }

        function parseCSV(text) {
            let result = [];
            let row = [];
            let inQuotes = false;
            let currentStr = '';
            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                if (c === '"') {
                    if (inQuotes && text[i+1] === '"') { currentStr += '"'; i++; } 
                    else { inQuotes = !inQuotes; }
                } else if (c === ',' && !inQuotes) {
                    row.push(currentStr); currentStr = '';
                } else if (c === '\n' && !inQuotes) {
                    row.push(currentStr); result.push(row); row = []; currentStr = '';
                } else if (c === '\r' && !inQuotes) { continue; } 
                else { currentStr += c; }
            }
            if (currentStr || row.length > 0) { row.push(currentStr); result.push(row); }
            return result;
        }

        dom.btnImport.addEventListener('click', async () => {
            const file = dom.csvFileInput.files[0];
            const customWeekName = dom.importWeekName.value.trim();

            if (!file) {
                showAdminMessage("請先選擇要上傳的 .csv 檔案。", "error");
                return;
            }

            dom.btnImport.disabled = true;
            dom.btnImport.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 處理中...';

            const reader = new FileReader();
            reader.onload = async (event) => {
                try {
                    const text = event.target.result;
                    const rows = parseCSV(text);
                    if (rows.length < 3) throw new Error("檔案格式不符或資料空白");

                    const titleRow = rows[0].join('');
                    const weekMatch = titleRow.match(/第[0-9]+週/);
                    
                    const weekName = customWeekName || (weekMatch ? weekMatch[0] : `自訂_${new Date().getTime()}`);

                    const headers = rows[1];
                    const dataToUpload = [];

                    for (let i = 2; i < rows.length; i++) {
                        const row = rows[i];
                        if (!row[0] || isNaN(parseInt(row[0]))) continue; 

                        const seatNo = row[0].trim();
                        const name = row[1] ? row[1].trim() : '';
                        const score = row[2] ? row[2].trim() : '';
                        const remark = row[row.length - 1] ? row[row.length - 1].trim() : ''; 
                        
                        const deductions = [];
                        for(let j = 3; j < headers.length - 1; j++) {
                            const headerTitle = headers[j] ? headers[j].trim() : '';
                            if (headerTitle.includes("星期")) {
                                const behavior = row[j] ? row[j].trim() : '';
                                const amount = row[j+1] ? row[j+1].trim() : ''; 
                                
                                if (behavior || (amount && amount !== '0')) {
                                    deductions.push({ 
                                        day: headerTitle, 
                                        reason: behavior || "無說明", 
                                        amount: amount || "0" 
                                    });
                                }
                            }
                        }

                        dataToUpload.push({
                            week: weekName,
                            seatNo: parseInt(seatNo),
                            name: name,
                            score: score,
                            remark: remark,
                            deductions: deductions
                        });
                    }

                    if (!auth.currentUser) throw new Error("未授權連線資料庫");
                    const scoresRef = collection(db, 'artifacts', appId, 'public', 'data', 'scores');
                    
                    for (let item of dataToUpload) {
                        const docId = `${item.week}_${item.seatNo}`;
                        await setDoc(doc(scoresRef, docId), item);
                    }

                    showAdminMessage(`✅ 成功匯入「${weekName}」，共 ${dataToUpload.length} 筆資料！`, "success");
                    dom.csvFileInput.value = ''; 
                    dom.importWeekName.value = ''; 

                } catch (err) {
                    console.error(err);
                    showAdminMessage(`匯入失敗：${err.message}`, "error");
                } finally {
                    dom.btnImport.disabled = false;
                    dom.btnImport.innerHTML = '<i class="fas fa-upload"></i> 上傳並解析寫入';
                }
            };
            reader.readAsText(file); 
        });

        dom.btnDelete.addEventListener('click', async () => {
            const targetWeek = dom.deleteWeekSelector.value;
            if (!targetWeek) {
                showAdminMessage("請選擇要刪除的週次", "error");
                return;
            }

            dom.btnDelete.disabled = true;
            dom.btnDelete.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

            try {
                const docsToDelete = appState.rawData.filter(d => d.week === targetWeek);
                if (docsToDelete.length === 0) throw new Error("找不到該週資料");

                for (let d of docsToDelete) {
                    const docId = `${d.week}_${d.seatNo}`;
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'scores', docId));
                }

                showAdminMessage(`🗑️ 已成功刪除「${targetWeek}」的所有紀錄！`, "success");
                
                if (appState.currentWeek === targetWeek) {
                    appState.currentWeek = "";
                }
            } catch (err) {
                showAdminMessage(`刪除失敗：${err.message}`, "error");
            } finally {
                dom.btnDelete.disabled = false;
                dom.btnDelete.innerHTML = '執行刪除';
            }
        });

    </script>
</body>
</html>
