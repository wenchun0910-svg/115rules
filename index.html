<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班級常規分數查詢系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f2f6f3; /* 抹茶淺綠底色 */
            color: #4a574a; /* 日式深苔綠字體 */
        }
        .matcha-border {
            border: 1px solid #d3ded2;
            box-shadow: 0 4px 10px -2px rgba(121, 148, 117, 0.1);
        }
        .table-row-even {
            background-color: #ffffff;
        }
        .table-row-odd {
            background-color: #f7fbf7; /* 極淺綠 */
        }
        /* 自定義捲軸 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #eef3ef; }
        ::-webkit-scrollbar-thumb { background: #b5c7b5; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #8ba887; }
        
        /* Toast 動畫 */
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .toast-enter { animation: slideIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-[#799475] text-white py-4 px-6 shadow-sm flex justify-between items-center sticky top-0 z-10 border-b border-[#678263]">
        <div class="flex items-center gap-2">
            <i data-lucide="leaf" class="w-6 h-6 text-[#f2f6f3]"></i>
            <h1 class="text-xl md:text-2xl font-bold tracking-wide">班級常規分數查詢</h1>
        </div>
        <button id="navAdminBtn" onclick="toggleAdminLogin()" class="text-sm bg-[#678263] hover:bg-[#556b51] text-white transition-colors px-3 py-1.5 rounded-full flex items-center gap-1 shadow-sm shrink-0">
            <i data-lucide="settings" class="w-4 h-4"></i> 管理
        </button>
    </header>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto px-4 py-8 max-w-4xl relative">
        
        <!-- Student View (Default) -->
        <div id="studentView" class="space-y-6 block">
            
            <!-- 選擇週次 -->
            <div class="bg-white p-6 rounded-2xl matcha-border flex flex-col md:flex-row items-center gap-4">
                <label for="weekSelect" class="text-lg font-bold text-[#4a574a] flex items-center gap-2 shrink-0">
                    <i data-lucide="calendar-days" class="w-5 h-5 text-[#799475]"></i> 選擇週次：
                </label>
                <select id="weekSelect" class="block w-full md:w-64 pl-3 pr-10 py-2.5 text-base border-[#d3ded2] focus:outline-none focus:ring-[#799475] focus:border-[#799475] sm:text-sm rounded-xl bg-[#f2f6f3] text-[#4a574a] transition-all" onchange="displaySelectedWeek()">
                    <option value="">載入中...</option>
                </select>
            </div>

            <!-- 內容顯示區 -->
            <div id="contentArea" class="hidden space-y-6" style="display: none;">
                <!-- 扣分說明 -->
                <div class="bg-[#f7fbf7] p-5 rounded-2xl matcha-border border-l-4 border-l-[#799475]">
                    <h3 class="text-lg font-bold mb-3 flex items-center gap-2 text-[#4a574a]">
                        <i data-lucide="message-circle-warning" class="w-5 h-5 text-[#799475]"></i> 扣分說明
                    </h3>
                    <div id="deductionText" class="text-[#5c6b5c] leading-relaxed whitespace-pre-wrap font-medium break-words">
                        <!-- 動態插入扣分說明 -->
                    </div>
                </div>

                <!-- 分數表格 -->
                <div class="bg-white rounded-2xl matcha-border overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-[#d3ded2]">
                            <thead class="bg-[#eef3ef]">
                                <tr>
                                    <th scope="col" class="px-6 py-4 text-left text-sm font-bold text-[#5c6b5c] uppercase tracking-wider w-1/4">座號</th>
                                    <th scope="col" class="px-6 py-4 text-left text-sm font-bold text-[#5c6b5c] uppercase tracking-wider w-1/2">姓名</th>
                                    <th scope="col" class="px-6 py-4 text-left text-sm font-bold text-[#5c6b5c] uppercase tracking-wider w-1/4">總分</th>
                                </tr>
                            </thead>
                            <tbody id="scoreTableBody" class="divide-y divide-[#d3ded2]">
                                <!-- 動態插入表格內容 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- 無資料提示 -->
            <div id="noDataArea" class="text-center py-16 text-[#8ba887]">
                <i data-lucide="leaf" class="w-12 h-12 mx-auto mb-4 opacity-50"></i>
                <p class="text-lg font-medium">目前尚無資料，請等待老師匯入。</p>
            </div>
        </div>

        <!-- Admin Dashboard -->
        <div id="adminDashboard" class="space-y-6" style="display: none;">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-[#4a574a] flex items-center gap-2">
                    <i data-lucide="layout-dashboard" class="w-6 h-6 text-[#799475]"></i> 管理面板
                </h2>
                <button onclick="logoutAdmin()" class="text-sm bg-[#e6eee6] hover:bg-[#dbe6db] text-[#4a574a] font-bold py-2 px-5 rounded-full transition-colors flex items-center gap-1 shrink-0">
                    <i data-lucide="log-out" class="w-4 h-4"></i> 登出
                </button>
            </div>

            <!-- 修改密碼區塊 -->
            <div class="bg-white p-6 rounded-2xl matcha-border">
                <h3 class="text-lg font-bold mb-4 border-b-2 border-[#eef3ef] pb-3 text-[#4a574a] flex items-center gap-2">
                    <i data-lucide="key-round" class="w-5 h-5 text-[#799475]"></i> 安全設定
                </h3>
                <div class="space-y-4 md:flex md:items-end md:gap-4 md:space-y-0">
                    <div class="flex-grow">
                        <label class="block text-sm font-bold text-[#5c6b5c] mb-1">修改管理員密碼</label>
                        <input type="password" id="newAdminPassword" class="block w-full px-4 py-2 bg-[#f2f6f3] border border-[#d3ded2] rounded-xl focus:outline-none focus:ring-2 focus:ring-[#799475] focus:border-transparent transition-all" placeholder="輸入新密碼">
                    </div>
                    <button onclick="changeAdminPassword()" class="w-full md:w-auto bg-[#678263] hover:bg-[#556b51] text-white font-bold py-2 px-6 rounded-xl transition-colors shadow-sm mt-3 md:mt-0 flex items-center justify-center gap-2 shrink-0">
                        <i data-lucide="save" class="w-4 h-4"></i> 儲存新密碼
                    </button>
                </div>
            </div>

            <!-- 匯入區塊 -->
            <div class="bg-white p-6 rounded-2xl matcha-border">
                <h3 class="text-lg font-bold mb-4 border-b-2 border-[#eef3ef] pb-3 text-[#4a574a] flex items-center gap-2">
                    <i data-lucide="file-up" class="w-5 h-5 text-[#799475]"></i> 匯入週次資料
                </h3>
                <div class="space-y-5">
                    <div>
                        <label class="block text-sm font-bold text-[#5c6b5c] mb-1">自訂週次名稱</label>
                        <input type="text" id="importWeekName" class="block w-full md:w-1/2 px-4 py-2 bg-[#f2f6f3] border border-[#d3ded2] rounded-xl focus:outline-none focus:ring-2 focus:ring-[#799475] focus:border-transparent transition-all" placeholder="例如：六下第9週">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-[#5c6b5c] mb-2">上傳 CSV 檔案</label>
                        <input type="file" id="importFile" accept=".csv" class="block w-full text-sm text-[#5c6b5c] file:mr-4 file:py-2.5 file:px-5 file:rounded-xl file:border-0 file:text-sm file:font-bold file:bg-[#eef3ef] file:text-[#799475] hover:file:bg-[#dbe6db] transition-colors cursor-pointer">
                        <p class="mt-2 text-xs text-[#8ba887]">※ 請確保格式包含「座號,姓名,總分」以及最後的「扣分說明」。</p>
                    </div>
                    <button onclick="handleImport()" class="bg-[#799475] hover:bg-[#678263] text-white font-bold py-2.5 px-6 rounded-xl transition-colors flex items-center gap-2 shadow-md shrink-0 w-fit" id="importBtn">
                        <i data-lucide="upload-cloud" class="w-5 h-5"></i> 開始匯入
                    </button>
                </div>
            </div>

            <!-- 管理現有資料 -->
            <div class="bg-white p-6 rounded-2xl matcha-border">
                <h3 class="text-lg font-bold mb-4 border-b-2 border-[#eef3ef] pb-3 text-[#4a574a] flex items-center gap-2">
                    <i data-lucide="database" class="w-5 h-5 text-[#799475]"></i> 管理已匯入資料
                </h3>
                <div class="overflow-x-auto rounded-xl border border-[#d3ded2]">
                    <table class="min-w-full divide-y divide-[#d3ded2]">
                        <thead class="bg-[#eef3ef]">
                            <tr>
                                <th scope="col" class="px-6 py-4 text-center text-sm font-bold text-[#5c6b5c] uppercase tracking-wider w-24">順序</th>
                                <th scope="col" class="px-6 py-4 text-left text-sm font-bold text-[#5c6b5c] uppercase tracking-wider">週次名稱 (點擊預覽)</th>
                                <th scope="col" class="px-6 py-4 text-left text-sm font-bold text-[#5c6b5c] uppercase tracking-wider hidden md:table-cell">建立時間</th>
                                <th scope="col" class="px-6 py-4 text-right text-sm font-bold text-[#5c6b5c] uppercase tracking-wider">操作</th>
                            </tr>
                        </thead>
                        <tbody id="adminWeeksTableBody" class="divide-y divide-[#d3ded2]">
                            <!-- 動態插入管理表格 -->
                        </tbody>
                    </table>
                    <div id="adminNoData" class="text-center py-8 text-[#8ba887] font-medium hidden">
                        尚無任何資料
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- Admin Login Modal -->
    <div id="adminLoginModal" class="fixed inset-0 z-50 bg-[#f2f6f3]/95 backdrop-blur-sm flex justify-center items-center" style="display: none;">
        <div class="bg-white p-8 rounded-2xl matcha-border max-w-sm w-full shadow-2xl border-t-4 border-t-[#799475] mx-4 mb-20">
            <h2 class="text-2xl font-bold mb-6 text-center text-[#4a574a]">管理員登入</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-[#4a574a] mb-1">請輸入密碼</label>
                    <input type="password" id="adminPassword" class="block w-full px-4 py-2.5 bg-[#f2f6f3] border border-[#d3ded2] rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-[#799475] focus:border-transparent transition-all" placeholder="預設為 admin123" onkeypress="if(event.key === 'Enter') loginAdmin()">
                </div>
                <div class="flex gap-3 mt-6">
                    <button onclick="toggleAdminLogin()" class="flex-1 bg-[#e6eee6] hover:bg-[#dbe6db] text-[#4a574a] font-bold py-2.5 px-4 rounded-xl transition-colors">取消</button>
                    <button onclick="loginAdmin()" class="flex-1 bg-[#799475] hover:bg-[#678263] text-white font-bold py-2.5 px-4 rounded-xl transition-colors shadow-md">登入</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Preview Modal -->
    <div id="previewModal" class="fixed inset-0 z-50 bg-[#f2f6f3]/95 backdrop-blur-sm flex justify-center items-center py-8" style="display: none;">
        <div class="bg-white p-6 rounded-2xl matcha-border max-w-2xl w-full h-full md:h-auto md:max-h-[85vh] flex flex-col shadow-2xl border-t-4 border-t-[#799475] mx-4 relative">
            
            <div class="flex justify-between items-center mb-4 shrink-0">
                <h2 class="text-xl md:text-2xl font-bold text-[#4a574a] flex items-center gap-2">
                    <i data-lucide="eye" class="w-6 h-6 text-[#799475]"></i>
                    <span id="previewModalTitle">週次預覽</span>
                </h2>
                <button onclick="closePreviewModal()" class="text-[#8ba887] hover:text-[#4a574a] transition-colors p-1 bg-[#f2f6f3] rounded-lg">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>

            <!-- Scrollable Content -->
            <div class="overflow-y-auto flex-grow pr-2 custom-scrollbar">
                <div class="bg-[#f7fbf7] p-4 rounded-xl matcha-border border-l-4 border-l-[#799475] mb-5">
                    <h3 class="font-bold mb-2 flex items-center gap-2 text-[#4a574a]">
                        <i data-lucide="info" class="w-4 h-4 text-[#799475]"></i>扣分說明
                    </h3>
                    <div id="previewDeductionText" class="text-sm text-[#5c6b5c] whitespace-pre-wrap leading-relaxed font-medium"></div>
                </div>

                <div class="rounded-xl border border-[#d3ded2] overflow-hidden">
                    <table class="min-w-full divide-y divide-[#d3ded2]">
                        <thead class="bg-[#eef3ef]">
                            <tr>
                                <th scope="col" class="px-4 py-3 text-left text-xs font-bold text-[#5c6b5c] uppercase w-1/4">座號</th>
                                <th scope="col" class="px-4 py-3 text-left text-xs font-bold text-[#5c6b5c] uppercase w-1/2">姓名</th>
                                <th scope="col" class="px-4 py-3 text-left text-xs font-bold text-[#5c6b5c] uppercase w-1/4">總分</th>
                            </tr>
                        </thead>
                        <tbody id="previewTableBody" class="divide-y divide-[#d3ded2] bg-white">
                            <!-- 預覽資料動態插入 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Firebase SDK & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- 全域變數定義 ---
        let db, auth, currentUser;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'routine-scores-app';
        let allWeeksData = [];
        let unsubscribeSnapshot = null;
        let unsubscribeSettings = null;
        let isAdminView = false;
        let currentAdminPassword = "admin123"; 

        // --- UI 控制邏輯綁定 ---
        window.toggleAdminLogin = () => {
            const modal = document.getElementById('adminLoginModal');
            const studentView = document.getElementById('studentView');
            const adminDashboard = document.getElementById('adminDashboard');
            const navAdminBtn = document.getElementById('navAdminBtn');

            if (isAdminView) {
                // 登出
                isAdminView = false;
                adminDashboard.style.display = 'none';
                studentView.style.display = 'block';
                navAdminBtn.innerHTML = '<i data-lucide="settings" class="w-4 h-4"></i> 管理';
                lucide.createIcons();
            } else {
                // 顯示/隱藏登入框
                if (modal.style.display === 'none' || modal.style.display === '') {
                    modal.style.display = 'flex';
                    document.getElementById('adminPassword').value = '';
                    setTimeout(() => document.getElementById('adminPassword').focus(), 100);
                } else {
                    modal.style.display = 'none';
                }
            }
        };

        window.loginAdmin = () => {
            const pwd = document.getElementById('adminPassword').value;
            if (pwd === currentAdminPassword) {
                isAdminView = true;
                document.getElementById('adminLoginModal').style.display = 'none';
                document.getElementById('studentView').style.display = 'none';
                document.getElementById('adminDashboard').style.display = 'block';
                document.getElementById('navAdminBtn').innerHTML = '<i data-lucide="arrow-left" class="w-4 h-4"></i> 返回';
                lucide.createIcons();
                updateAdminUI();
                showToast("登入成功，歡迎回來", "success");
            } else {
                showToast("密碼錯誤，請重試", "error");
            }
        };

        window.logoutAdmin = () => {
            window.toggleAdminLogin();
            showToast("已安全登出", "info");
        };

        // --- 預覽視窗邏輯 ---
        window.openPreviewModal = (weekId) => {
            const weekData = allWeeksData.find(w => w.id === weekId);
            if(!weekData) return;

            document.getElementById('previewModalTitle').textContent = `預覽：${weekData.weekName}`;
            document.getElementById('previewDeductionText').textContent = weekData.deductionInfo || "無特別扣分說明。";
            
            const tbody = document.getElementById('previewTableBody');
            tbody.innerHTML = '';

            if (weekData.students && weekData.students.length > 0) {
                weekData.students.forEach((student, index) => {
                    const tr = document.createElement('tr');
                    tr.className = index % 2 === 0 ? 'bg-white' : 'bg-[#f7fbf7]';
                    tr.innerHTML = `
                        <td class="px-4 py-3 whitespace-nowrap text-sm text-[#5c6b5c] font-bold">${student.num}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm text-[#4a574a] font-bold">${escapeHtml(student.name)}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm font-bold ${student.score < 80 ? 'text-[#c47070]' : 'text-[#799475]'}">${student.score}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } else {
                tbody.innerHTML = `<tr><td colspan="3" class="px-4 py-4 text-center text-sm text-[#8ba887]">無學生資料</td></tr>`;
            }

            document.getElementById('previewModal').style.display = 'flex';
        };

        window.closePreviewModal = () => {
            document.getElementById('previewModal').style.display = 'none';
        };

        // --- Firebase 初始化與資料連線 ---
        const initFirebase = async () => {
            let firebaseConfig;
            try {
              const firebaseConfig = {
  apiKey: "AIzaSyAFerL3UPvvzTfaDWgPNXnSrt0868filfo",
  authDomain: "rules-76007.firebaseapp.com",
  projectId: "rules-76007",
  storageBucket: "rules-76007.firebasestorage.app",
  messagingSenderId: "689515004432",
  appId: "1:689515004432:web:082a34aedb9eafc8c00095"
};

                
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        currentUser = user;
                        setupRealtimeListener();
                        setupSettingsListener();
                    } else {
                        currentUser = null;
                        if(unsubscribeSnapshot) unsubscribeSnapshot();
                        if(unsubscribeSettings) unsubscribeSettings();
                    }
                });
            } catch (error) {
                console.error("系統初始化或認證失敗:", error);
                showToast("連線系統發生錯誤，部分功能可能受限", "error");
            }
        };

        // --- 資料監聽邏輯 ---
        const setupRealtimeListener = () => {
            if (!currentUser) return;
            const scoresRef = collection(db, 'artifacts', appId, 'public', 'data', 'weekly_scores');
            
            unsubscribeSnapshot = onSnapshot(scoresRef, (snapshot) => {
                allWeeksData = [];
                snapshot.forEach((doc) => {
                    allWeeksData.push({ id: doc.id, ...doc.data() });
                });
                
                // 排序邏輯：優先比對 orderIndex，若無則看 createdAt，預設為由大到小(越新的/數字越大的排越前面)
                allWeeksData.sort((a, b) => {
                    const valA = a.orderIndex !== undefined ? a.orderIndex : (a.createdAt ? a.createdAt.toMillis() : 0);
                    const valB = b.orderIndex !== undefined ? b.orderIndex : (b.createdAt ? b.createdAt.toMillis() : 0);
                    return valB - valA; 
                });

                updateStudentUI();
                if(isAdminView) updateAdminUI();

            }, (error) => {
                console.error("Firestore Listen Error:", error);
                showToast("讀取資料發生錯誤", "error");
            });
        };

        const setupSettingsListener = () => {
            if (!currentUser) return;
            const settingsRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'admin_config');
            
            unsubscribeSettings = onSnapshot(settingsRef, (docSnap) => {
                if (docSnap.exists() && docSnap.data().password) {
                    currentAdminPassword = docSnap.data().password;
                }
            });
        };

        // --- 學生畫面更新邏輯 ---
        const updateStudentUI = () => {
            const selectEl = document.getElementById('weekSelect');
            const currentSelection = selectEl.value;
            
            selectEl.innerHTML = '';
            
            if (allWeeksData.length === 0) {
                selectEl.innerHTML = '<option value="">目前尚無資料</option>';
                selectEl.disabled = true;
                document.getElementById('contentArea').style.display = 'none';
                document.getElementById('noDataArea').style.display = 'block';
                return;
            }

            selectEl.disabled = false;
            document.getElementById('noDataArea').style.display = 'none';
            
            allWeeksData.forEach((week) => {
                const option = document.createElement('option');
                option.value = week.id;
                option.textContent = week.weekName;
                selectEl.appendChild(option);
            });

            if (currentSelection && allWeeksData.find(w => w.id === currentSelection)) {
                selectEl.value = currentSelection;
            } else {
                selectEl.selectedIndex = 0;
            }

            window.displaySelectedWeek();
        };

        window.displaySelectedWeek = () => {
            const selectEl = document.getElementById('weekSelect');
            const weekId = selectEl.value;
            const contentArea = document.getElementById('contentArea');
            
            if (!weekId) {
                contentArea.style.display = 'none';
                return;
            }

            const weekData = allWeeksData.find(w => w.id === weekId);
            if (!weekData) return;

            contentArea.style.display = 'block';
            document.getElementById('deductionText').textContent = weekData.deductionInfo || "無特別扣分說明。";

            const tbody = document.getElementById('scoreTableBody');
            tbody.innerHTML = '';
            
            if (weekData.students && weekData.students.length > 0) {
                weekData.students.forEach((student, index) => {
                    const tr = document.createElement('tr');
                    tr.className = index % 2 === 0 ? 'table-row-even hover:bg-[#f2f6f3] transition-colors' : 'table-row-odd hover:bg-[#f2f6f3] transition-colors';
                    tr.innerHTML = `
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-bold text-[#5c6b5c]">${student.num}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-bold text-[#4a574a]">${escapeHtml(student.name)}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-base font-bold ${student.score < 80 ? 'text-[#c47070]' : 'text-[#799475]'}">${student.score}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } else {
                tbody.innerHTML = `<tr><td colspan="3" class="px-6 py-4 text-center text-sm text-[#8ba887]">無學生資料</td></tr>`;
            }
        };

        // --- 管理畫面更新邏輯 ---
        const updateAdminUI = () => {
            const tbody = document.getElementById('adminWeeksTableBody');
            const noData = document.getElementById('adminNoData');
            tbody.innerHTML = '';

            if (allWeeksData.length === 0) {
                noData.style.display = 'block';
                return;
            }

            noData.style.display = 'none';
            allWeeksData.forEach((week, index) => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-[#f7fbf7] transition-colors';
                const dateStr = week.createdAt ? new Date(week.createdAt.toMillis()).toLocaleString('zh-TW') : '未知時間';
                
                tr.innerHTML = `
                    <td class="px-6 py-3 whitespace-nowrap text-center text-sm">
                        <div class="flex flex-col items-center gap-1 justify-center">
                            <button onclick="moveWeekOrder(${index}, -1)" class="p-1 rounded bg-[#eef3ef] text-[#799475] hover:bg-[#d3ded2] transition-colors ${index === 0 ? 'opacity-30 cursor-not-allowed pointer-events-none' : ''}" title="向上移"><i data-lucide="chevron-up" class="w-4 h-4"></i></button>
                            <button onclick="moveWeekOrder(${index}, 1)" class="p-1 rounded bg-[#eef3ef] text-[#799475] hover:bg-[#d3ded2] transition-colors ${index === allWeeksData.length - 1 ? 'opacity-30 cursor-not-allowed pointer-events-none' : ''}" title="向下移"><i data-lucide="chevron-down" class="w-4 h-4"></i></button>
                        </div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-bold">
                        <button onclick="openPreviewModal('${week.id}')" class="text-[#799475] hover:text-[#556b51] hover:underline transition-colors flex items-center gap-2">
                            ${escapeHtml(week.weekName)}
                            <i data-lucide="external-link" class="w-3 h-3 text-[#a1b89e]"></i>
                        </button>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-[#8ba887] hidden md:table-cell">${dateStr}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                        <button onclick="deleteWeek('${week.id}', '${escapeHtml(week.weekName)}')" class="text-[#c47070] hover:text-white transition-colors bg-[#fff5f5] hover:bg-[#c47070] px-3 py-1.5 rounded-lg border border-[#f0e1e3] shadow-sm">
                            <i data-lucide="trash-2" class="w-4 h-4 inline-block mr-1"></i>刪除
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            lucide.createIcons({root: tbody});
        };

        // --- 管理員操作功能 ---
        
        // 調整週次順序功能
        window.moveWeekOrder = async (index, direction) => {
            const targetIndex = index + direction;
            if (targetIndex < 0 || targetIndex >= allWeeksData.length) return;

            const currentWeek = allWeeksData[index];
            const targetWeek = allWeeksData[targetIndex];

            // 取得目前的排序數值 (若無則由建立時間產生)
            const currentOrder = currentWeek.orderIndex !== undefined ? currentWeek.orderIndex : (currentWeek.createdAt ? currentWeek.createdAt.toMillis() : Date.now());
            const targetOrder = targetWeek.orderIndex !== undefined ? targetWeek.orderIndex : (targetWeek.createdAt ? targetWeek.createdAt.toMillis() : Date.now() - 1000);

            // 確保要交換的兩個數值不是完全相同的(極端防護)
            let newCurrentOrder = targetOrder;
            let newTargetOrder = currentOrder;
            if (newCurrentOrder === newTargetOrder) {
                newCurrentOrder += (direction === -1 ? 1 : -1);
            }

            try {
                const currentRef = doc(db, 'artifacts', appId, 'public', 'data', 'weekly_scores', currentWeek.id);
                const targetRef = doc(db, 'artifacts', appId, 'public', 'data', 'weekly_scores', targetWeek.id);

                await updateDoc(currentRef, { orderIndex: newCurrentOrder });
                await updateDoc(targetRef, { orderIndex: newTargetOrder });
                // UI 會由 onSnapshot 自動重新排序與渲染
            } catch(error) {
                console.error("Order update error:", error);
                showToast("調整順序失敗", "error");
            }
        };

        window.changeAdminPassword = async () => {
            const newPwd = document.getElementById('newAdminPassword').value.trim();
            if (!newPwd) {
                showToast("請輸入新密碼", "error");
                return;
            }
            if (!currentUser) return;

            try {
                const settingsRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'admin_config');
                await setDoc(settingsRef, { password: newPwd }, { merge: true });
                showToast("密碼已成功更新！", "success");
                document.getElementById('newAdminPassword').value = '';
            } catch (error) {
                console.error("Update Password Error", error);
                showToast("更新密碼失敗", "error");
            }
        };

        window.handleImport = () => {
            const nameInput = document.getElementById('importWeekName').value.trim();
            const fileInput = document.getElementById('importFile');
            const btn = document.getElementById('importBtn');

            if (!nameInput) {
                showToast("請輸入週次名稱", "error");
                return;
            }
            if (fileInput.files.length === 0) {
                showToast("請選擇 CSV 檔案", "error");
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            btn.disabled = true;
            btn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> 處理中...';
            lucide.createIcons();

            reader.readAsText(file, 'big5'); 
            
            reader.onload = async (e) => {
                try {
                    const text = e.target.result;
                    const parsedData = parseCSV(text);

                    if (parsedData.students.length === 0) {
                        throw new Error("無法解析學生分數，請確認檔案格式是否正確。");
                    }

                    await saveToFirebase(nameInput, parsedData);
                    
                    showToast(`成功匯入 ${parsedData.students.length} 筆學生資料！`, "success");
                    document.getElementById('importWeekName').value = '';
                    document.getElementById('importFile').value = '';
                } catch (error) {
                    console.error("Import Error:", error);
                    showToast(error.message || "匯入失敗，請檢查檔案格式", "error");
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = '<i data-lucide="upload-cloud" class="w-5 h-5"></i> 開始匯入';
                    lucide.createIcons();
                }
            };

            reader.onerror = () => {
                showToast("讀取檔案時發生錯誤", "error");
                btn.disabled = false;
                btn.innerHTML = '<i data-lucide="upload-cloud" class="w-5 h-5"></i> 開始匯入';
                lucide.createIcons();
            };
        };

        window.deleteWeek = async (docId, weekName) => {
            const confirmDelete = window.confirm(`確定要刪除「${weekName}」的資料嗎？\n此動作無法復原。`);
            if(!confirmDelete) return;

            if (!currentUser) return;

            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'weekly_scores', docId);
                await deleteDoc(docRef);
                showToast("資料已成功刪除", "success");
            } catch (error) {
                console.error("Delete Error:", error);
                showToast("刪除失敗", "error");
            }
        };

        const parseCSV = (csvText) => {
            const lines = csvText.split(/\r?\n/);
            const students = [];
            let deductionInfo = "";

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                if (!line.trim()) continue;
                
                const cols = line.split(',');
                const num = parseInt(cols[0], 10);
                if (!isNaN(num) && cols[1] && cols[2]) {
                    students.push({
                        num: num,
                        name: cols[1].trim(),
                        score: parseInt(cols[2], 10) || 0
                    });
                } 
                else if (cols[0] && cols[0].trim() === '扣分說明') {
                    let info = cols.slice(1).join(',').trim();
                    info = info.replace(/,+$/, '').trim(); 
                    deductionInfo = info;
                }
            }

            students.sort((a, b) => a.num - b.num);
            return { students, deductionInfo };
        };

        const saveToFirebase = async (weekName, data) => {
            if (!currentUser) throw new Error("未授權連線");
            const docId = `week_${Date.now()}`;
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'weekly_scores', docId);
            await setDoc(docRef, {
                weekName: weekName,
                students: data.students,
                deductionInfo: data.deductionInfo,
                // 設定 orderIndex 確保新匯入的會排在最前面(數值最大)
                orderIndex: Date.now(), 
                createdAt: serverTimestamp()
            });
        };

        // --- 工具 ---
        const escapeHtml = (unsafe) => {
            return (unsafe||"").toString()
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        const showToast = (message, type = "info") => {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            
            let bgColor = "bg-[#4a574a]";
            let icon = "info";
            if (type === "success") { bgColor = "bg-[#678263]"; icon = "check-circle"; }
            if (type === "error") { bgColor = "bg-[#c47070]"; icon = "alert-circle"; }

            toast.className = `${bgColor} text-white font-bold px-5 py-3.5 rounded-xl shadow-lg flex items-center gap-3 toast-enter border border-[#f2f6f3]/20 pointer-events-auto`;
            toast.innerHTML = `<i data-lucide="${icon}" class="w-5 h-5"></i><span>${escapeHtml(message)}</span>`;
            
            container.appendChild(toast);
            lucide.createIcons({root: toast});

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                toast.style.transition = 'all 0.3s ease-out';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        // --- 啟動 ---
        try {
            lucide.createIcons();
        } catch(e) {
            console.error("圖標載入失敗", e);
        }
        window.addEventListener('DOMContentLoaded', initFirebase);

    </script>
</body>
</html>
