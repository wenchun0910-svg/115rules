<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班級常規分數查詢系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #fffafb; /* 櫻花粉白底色 */
            color: #5e4d4f; /* 日式褐灰色字體 */
        }
        .sakura-border {
            border: 1px solid #f0e1e3;
            box-shadow: 0 4px 10px -2px rgba(223, 168, 177, 0.1);
        }
        .table-row-even {
            background-color: #ffffff;
        }
        .table-row-odd {
            background-color: #fff7f8;
        }
        /* 自定義捲軸 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #fff5f6; }
        ::-webkit-scrollbar-thumb { background: #e6c5c9; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #d4a7ac; }
        
        /* Toast 動畫 */
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .toast-enter { animation: slideIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-[#dfa8b1] text-white py-4 px-6 shadow-sm flex justify-between items-center sticky top-0 z-10 border-b border-[#d197a0]">
        <div class="flex items-center gap-2">
            <i data-lucide="flower" class="w-6 h-6 text-[#fffafb]"></i>
            <h1 class="text-xl md:text-2xl font-bold tracking-wide">班級常規分數查詢</h1>
        </div>
        <button id="navAdminBtn" onclick="toggleAdminLogin()" class="text-sm bg-[#c98d96] hover:bg-[#b57a83] text-white transition-colors px-3 py-1.5 rounded-full flex items-center gap-1 shadow-sm">
            <i data-lucide="settings" class="w-4 h-4"></i> 管理
        </button>
    </header>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto px-4 py-8 max-w-4xl relative">
        
        <!-- Student View (Default) -->
        <div id="studentView" class="space-y-6 block">
            
            <!-- 選擇週次 -->
            <div class="bg-white p-6 rounded-2xl sakura-border flex flex-col md:flex-row items-center gap-4">
                <label for="weekSelect" class="text-lg font-bold text-[#5e4d4f] flex items-center gap-2">
                    <i data-lucide="calendar-days" class="w-5 h-5 text-[#dfa8b1]"></i> 選擇週次：
                </label>
                <select id="weekSelect" class="block w-full md:w-64 pl-3 pr-10 py-2.5 text-base border-[#f0e1e3] focus:outline-none focus:ring-[#dfa8b1] focus:border-[#dfa8b1] sm:text-sm rounded-xl bg-[#fffafb] text-[#5e4d4f] transition-all" onchange="displaySelectedWeek()">
                    <option value="">載入中...</option>
                </select>
            </div>

            <!-- 內容顯示區 -->
            <div id="contentArea" class="hidden space-y-6" style="display: none;">
                <!-- 扣分說明 -->
                <div class="bg-[#fff5f6] p-5 rounded-2xl sakura-border border-l-4 border-l-[#dfa8b1]">
                    <h3 class="text-lg font-bold mb-3 flex items-center gap-2 text-[#5e4d4f]">
                        <i data-lucide="message-circle-warning" class="w-5 h-5 text-[#dfa8b1]"></i> 扣分說明
                    </h3>
                    <div id="deductionText" class="text-[#756264] leading-relaxed whitespace-pre-wrap font-medium break-words">
                        <!-- 動態插入扣分說明 -->
                    </div>
                </div>

                <!-- 分數表格 -->
                <div class="bg-white rounded-2xl sakura-border overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-[#f0e1e3]">
                            <thead class="bg-[#fcf0f2]">
                                <tr>
                                    <th scope="col" class="px-6 py-4 text-left text-sm font-bold text-[#8f7b7d] uppercase tracking-wider w-1/4">座號</th>
                                    <th scope="col" class="px-6 py-4 text-left text-sm font-bold text-[#8f7b7d] uppercase tracking-wider w-1/2">姓名</th>
                                    <th scope="col" class="px-6 py-4 text-left text-sm font-bold text-[#8f7b7d] uppercase tracking-wider w-1/4">總分</th>
                                </tr>
                            </thead>
                            <tbody id="scoreTableBody" class="divide-y divide-[#f0e1e3]">
                                <!-- 動態插入表格內容 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- 無資料提示 -->
            <div id="noDataArea" class="text-center py-16 text-[#bdaab0]">
                <i data-lucide="leaf" class="w-12 h-12 mx-auto mb-4 opacity-50"></i>
                <p class="text-lg font-medium">目前尚無資料，請等待老師匯入。</p>
            </div>
        </div>

        <!-- Admin Dashboard -->
        <div id="adminDashboard" class="space-y-6" style="display: none;">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-[#5e4d4f] flex items-center gap-2">
                    <i data-lucide="layout-dashboard" class="w-6 h-6 text-[#dfa8b1]"></i> 管理面板
                </h2>
                <button onclick="logoutAdmin()" class="text-sm bg-[#f5e6e8] hover:bg-[#ebd2d5] text-[#5e4d4f] font-bold py-2 px-5 rounded-full transition-colors flex items-center gap-1">
                    <i data-lucide="log-out" class="w-4 h-4"></i> 登出
                </button>
            </div>

            <!-- 修改密碼區塊 -->
            <div class="bg-white p-6 rounded-2xl sakura-border">
                <h3 class="text-lg font-bold mb-4 border-b-2 border-[#fcf0f2] pb-3 text-[#5e4d4f] flex items-center gap-2">
                    <i data-lucide="key-round" class="w-5 h-5 text-[#dfa8b1]"></i> 安全設定
                </h3>
                <div class="space-y-4 md:flex md:items-end md:gap-4 md:space-y-0">
                    <div class="flex-grow">
                        <label class="block text-sm font-bold text-[#756264] mb-1">修改管理員密碼</label>
                        <input type="password" id="newAdminPassword" class="block w-full px-4 py-2 bg-[#fffafb] border border-[#f0e1e3] rounded-xl focus:outline-none focus:ring-2 focus:ring-[#dfa8b1] focus:border-transparent transition-all" placeholder="輸入新密碼">
                    </div>
                    <button onclick="changeAdminPassword()" class="w-full md:w-auto bg-[#8ca891] hover:bg-[#78947d] text-white font-bold py-2 px-6 rounded-xl transition-colors shadow-sm mt-3 md:mt-0 flex items-center justify-center gap-2">
                        <i data-lucide="save" class="w-4 h-4"></i> 儲存新密碼
                    </button>
                </div>
            </div>

            <!-- 匯入區塊 -->
            <div class="bg-white p-6 rounded-2xl sakura-border">
                <h3 class="text-lg font-bold mb-4 border-b-2 border-[#fcf0f2] pb-3 text-[#5e4d4f] flex items-center gap-2">
                    <i data-lucide="file-up" class="w-5 h-5 text-[#dfa8b1]"></i> 匯入週次資料
                </h3>
                <div class="space-y-5">
                    <div>
                        <label class="block text-sm font-bold text-[#756264] mb-1">自訂週次名稱</label>
                        <input type="text" id="importWeekName" class="block w-full md:w-1/2 px-4 py-2 bg-[#fffafb] border border-[#f0e1e3] rounded-xl focus:outline-none focus:ring-2 focus:ring-[#dfa8b1] focus:border-transparent transition-all" placeholder="例如：六下第9週">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-[#756264] mb-2">上傳 CSV 檔案</label>
                        <input type="file" id="importFile" accept=".csv" class="block w-full text-sm text-[#8f7b7d] file:mr-4 file:py-2.5 file:px-5 file:rounded-xl file:border-0 file:text-sm file:font-bold file:bg-[#fcf0f2] file:text-[#dfa8b1] hover:file:bg-[#f5e6e8] transition-colors cursor-pointer">
                        <p class="mt-2 text-xs text-[#bdaab0]">※ 請確保格式包含「座號,姓名,總分」以及最後的「扣分說明」。</p>
                    </div>
                    <button onclick="handleImport()" class="bg-[#dfa8b1] hover:bg-[#c98d96] text-white font-bold py-2.5 px-6 rounded-xl transition-colors flex items-center gap-2 shadow-md" id="importBtn">
                        <i data-lucide="upload-cloud" class="w-5 h-5"></i> 開始匯入
                    </button>
                </div>
            </div>

            <!-- 管理現有資料 -->
            <div class="bg-white p-6 rounded-2xl sakura-border">
                <h3 class="text-lg font-bold mb-4 border-b-2 border-[#fcf0f2] pb-3 text-[#5e4d4f] flex items-center gap-2">
                    <i data-lucide="database" class="w-5 h-5 text-[#dfa8b1]"></i> 管理已匯入資料
                </h3>
                <div class="overflow-x-auto rounded-xl border border-[#f0e1e3]">
                    <table class="min-w-full divide-y divide-[#f0e1e3]">
                        <thead class="bg-[#fcf0f2]">
                            <tr>
                                <th scope="col" class="px-6 py-4 text-left text-sm font-bold text-[#8f7b7d] uppercase tracking-wider">週次名稱</th>
                                <th scope="col" class="px-6 py-4 text-left text-sm font-bold text-[#8f7b7d] uppercase tracking-wider">建立時間</th>
                                <th scope="col" class="px-6 py-4 text-right text-sm font-bold text-[#8f7b7d] uppercase tracking-wider">操作</th>
                            </tr>
                        </thead>
                        <tbody id="adminWeeksTableBody" class="divide-y divide-[#f0e1e3]">
                            <!-- 動態插入管理表格 -->
                        </tbody>
                    </table>
                    <div id="adminNoData" class="text-center py-8 text-[#bdaab0] font-medium hidden">
                        尚無任何資料
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- Admin Login Modal (Fixed overlay to avoid CSS conflicts) -->
    <div id="adminLoginModal" class="fixed inset-0 z-50 bg-[#fffafb]/95 backdrop-blur-sm flex justify-center items-center" style="display: none;">
        <div class="bg-white p-8 rounded-2xl sakura-border max-w-sm w-full shadow-2xl border-t-4 border-t-[#dfa8b1] mx-4 mb-20">
            <h2 class="text-2xl font-bold mb-6 text-center text-[#5e4d4f]">管理員登入</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-[#5e4d4f] mb-1">請輸入密碼</label>
                    <input type="password" id="adminPassword" class="block w-full px-4 py-2.5 bg-[#fffafb] border border-[#f0e1e3] rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-[#dfa8b1] focus:border-transparent transition-all" placeholder="預設為 admin123" onkeypress="if(event.key === 'Enter') loginAdmin()">
                </div>
                <div class="flex gap-3 mt-6">
                    <button onclick="toggleAdminLogin()" class="flex-1 bg-[#f5e6e8] hover:bg-[#ebd2d5] text-[#5e4d4f] font-bold py-2.5 px-4 rounded-xl transition-colors">取消</button>
                    <button onclick="loginAdmin()" class="flex-1 bg-[#dfa8b1] hover:bg-[#c98d96] text-white font-bold py-2.5 px-4 rounded-xl transition-colors shadow-md">登入</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Firebase SDK & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- 全域變數定義 ---
        let db, auth, currentUser;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'routine-scores-app';
        let allWeeksData = [];
        let unsubscribeSnapshot = null;
        let unsubscribeSettings = null;
        let isAdminView = false;
        let currentAdminPassword = "admin123"; 

        // --- UI 控制邏輯綁定 (確保最優先掛載到 window，避免按鈕失效) ---
        window.toggleAdminLogin = () => {
            const modal = document.getElementById('adminLoginModal');
            const studentView = document.getElementById('studentView');
            const adminDashboard = document.getElementById('adminDashboard');
            const navAdminBtn = document.getElementById('navAdminBtn');

            if (isAdminView) {
                // 登出或關閉儀表板
                isAdminView = false;
                adminDashboard.style.display = 'none';
                studentView.style.display = 'block';
                navAdminBtn.innerHTML = '<i data-lucide="settings" class="w-4 h-4"></i> 管理';
                lucide.createIcons();
            } else {
                // 顯示或隱藏登入框 (使用 style.display 取代 classList.toggle，解決潛在的 CSS 覆蓋問題)
                if (modal.style.display === 'none' || modal.style.display === '') {
                    modal.style.display = 'flex';
                    document.getElementById('adminPassword').value = '';
                    // 延遲聚焦，確保 DOM 已渲染
                    setTimeout(() => document.getElementById('adminPassword').focus(), 100);
                } else {
                    modal.style.display = 'none';
                }
            }
        };

        window.loginAdmin = () => {
            const pwd = document.getElementById('adminPassword').value;
            if (pwd === currentAdminPassword) {
                isAdminView = true;
                document.getElementById('adminLoginModal').style.display = 'none';
                document.getElementById('studentView').style.display = 'none';
                document.getElementById('adminDashboard').style.display = 'block';
                document.getElementById('navAdminBtn').innerHTML = '<i data-lucide="arrow-left" class="w-4 h-4"></i> 返回';
                lucide.createIcons();
                updateAdminUI();
                showToast("登入成功，歡迎回來", "success");
            } else {
                showToast("密碼錯誤，請重試", "error");
            }
        };

        window.logoutAdmin = () => {
            window.toggleAdminLogin();
            showToast("已安全登出", "info");
        };

        window.displaySelectedWeek = () => {
            const selectEl = document.getElementById('weekSelect');
            const weekId = selectEl.value;
            const contentArea = document.getElementById('contentArea');
            
            if (!weekId) {
                contentArea.style.display = 'none';
                return;
            }

            const weekData = allWeeksData.find(w => w.id === weekId);
            if (!weekData) return;

            contentArea.style.display = 'block';

            // 更新扣分說明
            document.getElementById('deductionText').textContent = weekData.deductionInfo || "無特別扣分說明。";

            // 更新表格
            const tbody = document.getElementById('scoreTableBody');
            tbody.innerHTML = '';
            
            if (weekData.students && weekData.students.length > 0) {
                weekData.students.forEach((student, index) => {
                    const tr = document.createElement('tr');
                    tr.className = index % 2 === 0 ? 'table-row-even hover:bg-[#fff5f6] transition-colors' : 'table-row-odd hover:bg-[#fff5f6] transition-colors';
                    tr.innerHTML = `
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-bold text-[#756264]">${student.num}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-bold text-[#5e4d4f]">${escapeHtml(student.name)}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-base font-bold ${student.score < 80 ? 'text-[#cc858a]' : 'text-[#8ca891]'}">${student.score}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } else {
                tbody.innerHTML = `<tr><td colspan="3" class="px-6 py-4 text-center text-sm text-[#bdaab0]">無學生資料</td></tr>`;
            }
        };

        // --- Firebase 初始化與資料連線 ---
        const initFirebase = async () => {
            let firebaseConfig;
            try {
                // 安全解析 Firebase Config
                if (typeof __firebase_config !== 'undefined') {
                      
  apiKey: "AIzaSyAmFsYszaIDv2YnJNOi0oOf0rzqEE2yx5s",
  authDomain: "rules-2b444.firebaseapp.com",
  projectId: "rules-2b444",
  storageBucket: "rules-2b444.firebasestorage.app",
  messagingSenderId: "399429207355",
  appId: "1:399429207355:web:7cbbc07d8186780553631e"
};

                } else {
                    firebaseConfig = { projectId: "mock-project" };
                }
                
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                // 認證優先
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        currentUser = user;
                        setupRealtimeListener();
                        setupSettingsListener();
                    } else {
                        currentUser = null;
                        if(unsubscribeSnapshot) unsubscribeSnapshot();
                        if(unsubscribeSettings) unsubscribeSettings();
                    }
                });
            } catch (error) {
                console.error("系統初始化或認證失敗:", error);
                showToast("連線系統發生錯誤，部分功能可能受限", "error");
            }
        };

        // --- 資料監聽邏輯 ---
        const setupRealtimeListener = () => {
            if (!currentUser) return;
            const scoresRef = collection(db, 'artifacts', appId, 'public', 'data', 'weekly_scores');
            
            unsubscribeSnapshot = onSnapshot(scoresRef, (snapshot) => {
                allWeeksData = [];
                snapshot.forEach((doc) => {
                    allWeeksData.push({ id: doc.id, ...doc.data() });
                });
                
                allWeeksData.sort((a, b) => {
                    const timeA = a.createdAt ? a.createdAt.toMillis() : 0;
                    const timeB = b.createdAt ? b.createdAt.toMillis() : 0;
                    return timeB - timeA;
                });

                updateStudentUI();
                if(isAdminView) updateAdminUI();

            }, (error) => {
                console.error("Firestore Listen Error:", error);
                showToast("讀取資料發生錯誤", "error");
            });
        };

        const setupSettingsListener = () => {
            if (!currentUser) return;
            const settingsRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'admin_config');
            
            unsubscribeSettings = onSnapshot(settingsRef, (docSnap) => {
                if (docSnap.exists() && docSnap.data().password) {
                    currentAdminPassword = docSnap.data().password;
                }
            }, (error) => {
                console.error("Settings Listen Error:", error);
            });
        };

        // --- 畫面更新邏輯 ---
        const updateStudentUI = () => {
            const selectEl = document.getElementById('weekSelect');
            const currentSelection = selectEl.value;
            
            selectEl.innerHTML = '';
            
            if (allWeeksData.length === 0) {
                selectEl.innerHTML = '<option value="">目前尚無資料</option>';
                selectEl.disabled = true;
                document.getElementById('contentArea').style.display = 'none';
                document.getElementById('noDataArea').style.display = 'block';
                return;
            }

            selectEl.disabled = false;
            document.getElementById('noDataArea').style.display = 'none';
            
            allWeeksData.forEach((week) => {
                const option = document.createElement('option');
                option.value = week.id;
                option.textContent = week.weekName;
                selectEl.appendChild(option);
            });

            if (currentSelection && allWeeksData.find(w => w.id === currentSelection)) {
                selectEl.value = currentSelection;
            } else {
                selectEl.selectedIndex = 0;
            }

            window.displaySelectedWeek();
        };

        const updateAdminUI = () => {
            const tbody = document.getElementById('adminWeeksTableBody');
            const noData = document.getElementById('adminNoData');
            tbody.innerHTML = '';

            if (allWeeksData.length === 0) {
                noData.style.display = 'block';
                return;
            }

            noData.style.display = 'none';
            allWeeksData.forEach((week) => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-[#fff5f6] transition-colors';
                const dateStr = week.createdAt ? new Date(week.createdAt.toMillis()).toLocaleString('zh-TW') : '未知時間';
                
                tr.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-bold text-[#5e4d4f]">${escapeHtml(week.weekName)}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-[#8f7b7d]">${dateStr}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                        <button onclick="deleteWeek('${week.id}', '${escapeHtml(week.weekName)}')" class="text-[#cc858a] hover:text-white transition-colors bg-[#fcf0f2] hover:bg-[#cc858a] px-3 py-1.5 rounded-lg border border-[#f0e1e3] shadow-sm">
                            <i data-lucide="trash-2" class="w-4 h-4 inline-block mr-1"></i>刪除
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            lucide.createIcons({root: tbody});
        };

        // --- 管理員操作功能 ---
        window.changeAdminPassword = async () => {
            const newPwd = document.getElementById('newAdminPassword').value.trim();
            if (!newPwd) {
                showToast("請輸入新密碼", "error");
                return;
            }
            if (!currentUser) return;

            try {
                const settingsRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'admin_config');
                await setDoc(settingsRef, { password: newPwd }, { merge: true });
                showToast("密碼已成功更新！", "success");
                document.getElementById('newAdminPassword').value = '';
            } catch (error) {
                console.error("Update Password Error", error);
                showToast("更新密碼失敗", "error");
            }
        };

        window.handleImport = () => {
            const nameInput = document.getElementById('importWeekName').value.trim();
            const fileInput = document.getElementById('importFile');
            const btn = document.getElementById('importBtn');

            if (!nameInput) {
                showToast("請輸入週次名稱", "error");
                return;
            }
            if (fileInput.files.length === 0) {
                showToast("請選擇 CSV 檔案", "error");
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            btn.disabled = true;
            btn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> 處理中...';
            lucide.createIcons();

            reader.readAsText(file, 'big5'); 
            
            reader.onload = async (e) => {
                try {
                    const text = e.target.result;
                    const parsedData = parseCSV(text);

                    if (parsedData.students.length === 0) {
                        throw new Error("無法解析學生分數，請確認檔案格式是否正確。");
                    }

                    await saveToFirebase(nameInput, parsedData);
                    
                    showToast(`成功匯入 ${parsedData.students.length} 筆學生資料！`, "success");
                    document.getElementById('importWeekName').value = '';
                    document.getElementById('importFile').value = '';
                } catch (error) {
                    console.error("Import Error:", error);
                    showToast(error.message || "匯入失敗，請檢查檔案格式", "error");
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = '<i data-lucide="upload-cloud" class="w-5 h-5"></i> 開始匯入';
                    lucide.createIcons();
                }
            };

            reader.onerror = () => {
                showToast("讀取檔案時發生錯誤", "error");
                btn.disabled = false;
                btn.innerHTML = '<i data-lucide="upload-cloud" class="w-5 h-5"></i> 開始匯入';
                lucide.createIcons();
            };
        };

        window.deleteWeek = async (docId, weekName) => {
            const confirmDelete = window.confirm(`確定要刪除「${weekName}」的資料嗎？\n此動作無法復原。`);
            if(!confirmDelete) return;

            if (!currentUser) return;

            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'weekly_scores', docId);
                await deleteDoc(docRef);
                showToast("資料已成功刪除", "success");
            } catch (error) {
                console.error("Delete Error:", error);
                showToast("刪除失敗", "error");
            }
        };

        const parseCSV = (csvText) => {
            const lines = csvText.split(/\r?\n/);
            const students = [];
            let deductionInfo = "";

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                if (!line.trim()) continue;
                
                const cols = line.split(',');
                const num = parseInt(cols[0], 10);
                if (!isNaN(num) && cols[1] && cols[2]) {
                    students.push({
                        num: num,
                        name: cols[1].trim(),
                        score: parseInt(cols[2], 10) || 0
                    });
                } 
                else if (cols[0] && cols[0].trim() === '扣分說明') {
                    let info = cols.slice(1).join(',').trim();
                    info = info.replace(/,+$/, '').trim(); 
                    deductionInfo = info;
                }
            }

            students.sort((a, b) => a.num - b.num);
            return { students, deductionInfo };
        };

        const saveToFirebase = async (weekName, data) => {
            if (!currentUser) throw new Error("未授權連線");
            const docId = `week_${Date.now()}`;
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'weekly_scores', docId);
            await setDoc(docRef, {
                weekName: weekName,
                students: data.students,
                deductionInfo: data.deductionInfo,
                createdAt: serverTimestamp()
            });
        };

        // --- 工具 ---
        const escapeHtml = (unsafe) => {
            return (unsafe||"").toString()
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        const showToast = (message, type = "info") => {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            
            let bgColor = "bg-[#756264]";
            let icon = "info";
            if (type === "success") { bgColor = "bg-[#8ca891]"; icon = "check-circle"; }
            if (type === "error") { bgColor = "bg-[#cc858a]"; icon = "alert-circle"; }

            toast.className = `${bgColor} text-white font-bold px-5 py-3.5 rounded-xl shadow-lg flex items-center gap-3 toast-enter border border-[#fffafb]/20 pointer-events-auto`;
            toast.innerHTML = `<i data-lucide="${icon}" class="w-5 h-5"></i><span>${escapeHtml(message)}</span>`;
            
            container.appendChild(toast);
            lucide.createIcons({root: toast});

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                toast.style.transition = 'all 0.3s ease-out';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        // --- 啟動 ---
        try {
            lucide.createIcons();
        } catch(e) {
            console.error("圖標載入失敗", e);
        }
        window.addEventListener('DOMContentLoaded', initFirebase);

    </script>
</body>
</html>
